name: Linux SSH Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup SSH Server
        run: |
          sudo apt update
          sudo apt install openssh-server -y
          sudo systemctl start ssh
          
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          sudo useradd -m -s /bin/bash sshuser
          echo "sshuser:Ssh@2026" | sudo chpasswd
          sudo usermod -aG sudo sshuser

      - name: Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="ssh-only"
          
          IP=$(tailscale ip -4)
          echo ""
          echo "=========================================="
          echo "  SSH SERVER READY!"
          echo "  Connect with Bitvise:"
          echo "  Host: $IP"
          echo "  Port: 22"
          echo "  User: sshuser"
          echo "  Pass: Ssh@2026"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            sleep 60
            echo "SSH server running on port 22"
          done
